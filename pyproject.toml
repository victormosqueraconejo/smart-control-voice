[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-control-voice"
version = "0.1.0"
description = "Voice-controlled Kodi remote through Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "httpx>=0.27.0",
    "groq>=0.13.0",
    "pydantic-settings>=2.6.0",
    "python-telegram-bot>=21.9",
    "yt-dlp>=2024.12.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
smart-control-voice = "smart_control_voice.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_control_voice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true